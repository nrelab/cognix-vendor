# Central vendor repository for cognix.
# Consumed via git dependencies, e.g.:
#   objc = { git = "https://github.com/nrelab/cognix-vendor.git" }
#
# Only crates without their own upstream workspace are listed as
# members; crates inside nested workspaces (winit, notify, vte, ...)
# are still resolvable as git dependencies but excluded here so that
# cargo commands inside this repo do not hit workspace conflicts.

[workspace]
resolver = "2"
members = [
  "command-corrections",
  "difflib",
  "dwrote-rs",
  "font-kit",
  "mermaid-to-svg",
  "mermaid-to-svg/crates/dagre_rust",
  "rust-email_address",
  "rust-objc",
  "session-sharing-protocol",
  "uneval",
  "yaml-rust",
]
