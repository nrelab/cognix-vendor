# Cognix Vendor repository configuration.
# Initial scaffold: command-line flags currently control runtime paths.

[repository]
name = "cognix-vendor"
version = 1

[consumer.cognix]
manifest_path = "../cognix/Cargo.toml"
metadata_dir = "metadata/cognix"
vendor_dir = "vendor"

[policy]
# Review license terms before redistributing third-party source.
allowed_licenses = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC"]
deny_unknown_licenses = true
