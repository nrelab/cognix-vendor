[package]
name = "cognix-vendor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Manage reproducible, auditable Cargo vendor snapshots for Cognix and related Rust workspaces."

[[bin]]
name = "cognix-vendor"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cargo_metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
