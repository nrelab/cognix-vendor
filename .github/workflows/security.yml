name: Security audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfile for scaffold dependencies
        run: cargo generate-lockfile
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit scaffold dependencies
        run: cargo audit
